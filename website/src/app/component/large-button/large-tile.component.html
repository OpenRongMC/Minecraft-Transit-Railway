@if (disabled) {
	<div class="column gap-small center square disabled">
		<div *ngTemplateOutlet="content"></div>
	</div>
} @else if (clickable) {
	<div class="column gap-small center square clickable" matRipple role="button" tabindex="0" (click)="onClick()" (keydown.enter)="onClick()" (keydown.space)="$event.preventDefault(); onClick()">
		<div *ngTemplateOutlet="content"></div>
	</div>
} @else {
	<div class="column gap-small center square">
		<div *ngTemplateOutlet="content"></div>
	</div>
}

<ng-template #content>
	<div class="spacing"></div>
	<mat-icon class="large-icon">{{ icon }}</mat-icon>
	<ng-content/>
	<div class="spacing"></div>
</ng-template>
